<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Dashboard</title><link rel="stylesheet" href="assets/css/student-form.css"></head>
<body><main><div class="topbar"><h1 id="title">Dashboard</h1><a class="button" href="logout">Logout</a></div><section class="panel"><p id="message"></p><div id="links"></div></section></main><script>const role = (new URLSearchParams(location.search).get('role') || 'USER').toUpperCase(); const title = document.getElementById('title'); const message = document.getElementById('message'); const links = document.getElementById('links'); const root = location.pathname.includes('/') ? location.pathname.substring(0, location.pathname.lastIndexOf('/') + 1) : './'; title.textContent = role + ' Dashboard'; message.textContent = 'You are signed in with the ' + role + ' role.'; if (role === 'ADMIN') links.innerHTML = '<p><a class="button" href="students/list">Manage students</a></p>'; else if (role === 'FACULTY') links.innerHTML = '<p><a class="button" href="students/list">View students</a></p>'; else links.innerHTML = '<p>Student dashboard is ready.</p>';</script></body></html>
