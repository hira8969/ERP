<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Student Management</title>
    <link rel="stylesheet" href="assets/css/student-form.css">
</head>
<body><main>
    <div class="topbar"><h1>Centurion University Students</h1><a class="button" href="students/add">Add student</a></div>
    <p id="error-message" class="error" hidden></p>
    <section class="panel">
        <table><thead><tr><th>ID</th><th>Admission no.</th><th>Name</th><th>Email</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody id="student-rows"><tr><td colspan="6">Loading students...</td></tr></tbody></table>
    </section>
</main>
<script>
const root = window.location.pathname.includes('/students/') ? window.location.pathname.split('/students/')[0] + '/' : './';
const rows = document.getElementById('student-rows');
const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, character => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[character]));
fetch(root + 'api/students').then(response => { if (!response.ok) throw new Error('Unable to load students.'); return response.json(); }).then(students => {
    rows.innerHTML = students.length ? students.map(student => `<tr><td>${student.studentId}</td><td>${escapeHtml(student.admissionNumber)}</td><td>${escapeHtml([student.firstName, student.lastName].filter(Boolean).join(' '))}</td><td>${escapeHtml(student.email)}</td><td>${escapeHtml(student.status)}</td><td class="actions"><a href="${root}students/details?id=${student.studentId}">View</a><a href="${root}students/edit?id=${student.studentId}">Edit</a><form method="post" action="${root}students/delete" onsubmit="return confirm('Delete this student?');"><input type="hidden" name="id" value="${student.studentId}"><button class="link-button" type="submit">Delete</button></form></td></tr>`).join('') : '<tr><td colspan="6">No students found.</td></tr>';
}).catch(error => { document.getElementById('error-message').textContent = error.message; document.getElementById('error-message').hidden = false; rows.innerHTML = '<tr><td colspan="6">Unable to load students.</td></tr>'; });
</script>
</body></html>
