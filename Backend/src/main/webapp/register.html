<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Register</title><link rel="stylesheet" href="assets/css/student-form.css"></head>
<body><main><section class="panel"><h1>Create student account</h1><p id="error" class="error" hidden></p><form method="post" action="register"><div class="form-grid"><label>Username<input name="username" required maxlength="100"></label><label>Gmail address<input type="email" name="email" pattern="[A-Za-z0-9._%+-]+@gmail\.com" title="Use a Gmail address ending with @gmail.com" required maxlength="150"></label><label>Password<input type="password" name="password" minlength="8" required></label></div><p><button type="submit">Register</button></p></form><p>Already registered? <a href="login.html">Login</a></p></section></main><script>const error = new URLSearchParams(location.search).get('error'); if (error) { const element = document.getElementById('error'); element.textContent = error; element.hidden = false; }</script></body></html>
