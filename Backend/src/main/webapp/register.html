<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Centurion University ERP - Student Registration</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/student-form.css">
</head>
<body>
<main>
    <div class="topbar">
        <a href="login.html" class="link-muted">&larr; Back to Sign In</a>
        <span class="badge badge-primary">&#127891; Student Self-Registration</span>
    </div>

    <section class="panel auth-panel">
        <div class="auth-header">
            <img src="assets/img/university-logo.jpg" alt="Centurion University Logo" style="width: 72px; height: 72px; border-radius: 50%; box-shadow: 0 4px 14px rgba(0,0,0,0.15); margin-bottom: 12px; object-fit: cover; border: 2px solid #ffffff;">
            <div class="portal-badge">NEW STUDENT PORTAL</div>
            <h1>Create Student Account</h1>
            <p class="muted">Register to access your personal academic records, syllabus, notices, and exam results</p>
        </div>

        <p id="error" class="alert error" hidden></p>

        <form method="post" action="register" id="registerForm">
            <div class="form-grid single-col">
                <label>
                    Full Name / Username
                    <input type="text" name="username" id="username" required maxlength="100" placeholder="e.g. rahul_kumar" autocomplete="username">
                </label>
                <label>
                    Email Address
                    <input type="email" name="email" id="email" required maxlength="150" placeholder="student@college.edu or name@gmail.com" autocomplete="email">
                </label>
                <label>
                    Password
                    <input type="password" name="password" id="password" minlength="6" required placeholder="Choose a password (min 6 characters)" autocomplete="new-password">
                </label>
            </div>
            <p style="margin-top: 22px;">
                <button type="submit" class="button button-primary button-block">Create Student Account &rarr;</button>
            </p>
        </form>

        <div class="auth-links" style="justify-content: center; margin-top: 22px;">
            <p>Already have an account? <a href="login.html">Sign In here</a></p>
        </div>
    </section>
</main>
<script>
    const params = new URLSearchParams(window.location.search);
    const errorParam = params.get('error');
    if (errorParam) {
        const errorEl = document.getElementById('error');
        errorEl.textContent = errorParam;
        errorEl.hidden = false;
    }
</script>
</body>
</html>
