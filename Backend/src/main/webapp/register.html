<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Centurion University ERP - Register Student Account</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/student-form.css">
</head>
<body>
<main>
    <div class="topbar">
        <a href="index.html" class="link-muted">&larr; Back to Portal Home</a>
        <span class="badge badge-success">&#127891; Student Self-Registration</span>
    </div>

    <section class="panel auth-panel">
        <div class="auth-header">
            <div class="portal-badge">NEW STUDENT PORTAL</div>
            <h1>Create Student Account</h1>
            <p class="muted">Register to access your personal dashboard, results, syllabus, and course timetable</p>
        </div>

        <p id="error" class="alert error" hidden></p>

        <form method="post" action="register">
            <div class="form-grid single-col">
                <label>
                    Username
                    <input name="username" required maxlength="100" placeholder="e.g. ashakumar" autocomplete="username">
                </label>
                <label>
                    Gmail Address
                    <input type="email" name="email" pattern="[A-Za-z0-9._%+-]+@gmail\.com" title="Use a Gmail address ending with @gmail.com" required maxlength="150" placeholder="name@gmail.com" autocomplete="email">
                </label>
                <label>
                    Password
                    <input type="password" name="password" minlength="8" required placeholder="Choose a password (min 8 chars)" autocomplete="new-password">
                </label>
            </div>
            <p style="margin-top: 22px;">
                <button type="submit" class="button button-primary button-block">Create Student Account &rarr;</button>
            </p>
        </form>

        <div class="auth-links" style="justify-content: center; margin-top: 22px;">
            <p>Already have an enrolled account? <a href="login.html">Sign In</a></p>
        </div>
    </section>
</main>
<script>
    const error = new URLSearchParams(location.search).get('error');
    if (error) {
        const element = document.getElementById('error');
        element.textContent = error;
        element.hidden = false;
    }
</script>
</body>
</html>
