<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit Student - Centurion University ERP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/student-form.css">
</head>
<body>
    <!-- Main Navigation Bar -->
    <header class="erp-navbar">
        <div class="erp-navbar-inner">
            <a href="dashboard.html" class="erp-brand">
                <img src="assets/img/university-logo.jpg" alt="Centurion University Logo" class="erp-brand-img">
                <span class="erp-brand-text">
                    <span class="erp-brand-title">Centurion <strong>ERP</strong></span>
                    <span class="erp-brand-badge">Academic</span>
                </span>
            </a>
            <nav class="erp-nav" id="erpNav">
                <ul class="erp-nav-links">
                    <li><a href="dashboard.html"><span class="nav-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg></span> Dashboard</a></li>
                    <li><a href="student-list.html" class="active"><span class="nav-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></span> Students</a></li>
                    <li><a href="faculty-list.html"><span class="nav-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></span> Faculty</a></li>
                    <li><a href="courses.html"><span class="nav-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg></span> Courses</a></li>
                    <li><a href="attendance.html"><span class="nav-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></span> Attendance</a></li>
                    <li><a href="results.html"><span class="nav-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="7"/><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"/></svg></span> Results</a></li>
                    <li><a href="timetable.html"><span class="nav-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></span> Timetable</a></li>
                    <li><a href="notices.html"><span class="nav-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg></span> Notices</a></li>
                </ul>
            </nav>
            <div class="erp-nav-actions">
                <a class="erp-nav-logout" href="logout" title="Sign out of ERP">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                    <span>Logout</span>
                </a>
            </div>

            <!-- Mobile hamburger toggle -->
            <button class="erp-nav-toggle" id="navToggle" aria-label="Toggle navigation" onclick="document.getElementById('erpNav').classList.toggle('open')">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
            </button>
        </div>
    </header>

<main>
    <div class="topbar" style="margin-top: 24px;">
        <div>
            <h1 style="margin: 0;">Edit Student Record</h1>
            <p class="muted" style="margin: 4px 0 0 0;">Update student details and academic enrolment</p>
        </div>
        <div style="display: flex; gap: 10px;">
            <a class="button button-outline button-small" href="student-list.html">&larr; Back to List</a>
            <a class="button button-outline button-small" href="dashboard.html">Dashboard</a>
        </div>
    </div>

    <p id="error-message" class="alert error" hidden></p>

    <section class="panel">
        <form id="edit-student-form" method="post" action="students/update">
            <input type="hidden" name="studentId">

            <h3 style="margin-top: 0; border-bottom: 1px solid #e2e8f0; padding-bottom: 8px;">Basic &amp; Academic Info</h3>
            <div class="form-grid">
                <label>Admission Number *<input name="admissionNumber" required></label>
                <label>Roll Number<input name="rollNumber"></label>
                <label>First Name *<input name="firstName" required></label>
                <label>Last Name<input name="lastName"></label>
                <label>Gender
                    <select name="gender">
                        <option value="">Select Gender</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                    </select>
                </label>
                <label>Date of Birth<input type="date" name="dateOfBirth"></label>
                <label>Department *
                    <select name="departmentId" id="departmentSelect" required>
                        <option value="1">1 - Computer Science and Engineering (CSE)</option>
                    </select>
                </label>
                <label>Course *
                    <select name="courseId" id="courseSelect" required>
                        <option value="1">1 - Bachelor of Computer Applications (BCA)</option>
                    </select>
                </label>
                <label>Semester Number *
                    <select name="semesterId" required>
                        <option value="1">Semester 1</option>
                        <option value="2">Semester 2</option>
                        <option value="3">Semester 3</option>
                        <option value="4">Semester 4</option>
                        <option value="5">Semester 5</option>
                        <option value="6">Semester 6</option>
                        <option value="7">Semester 7</option>
                        <option value="8">Semester 8</option>
                    </select>
                </label>
                <label>Admission Date<input type="date" name="admissionDate"></label>
            </div>

            <h3 style="border-bottom: 1px solid #e2e8f0; padding-bottom: 8px; margin-top: 24px;">Contact &amp; Personal Info</h3>
            <div class="form-grid">
                <label>Email<input type="email" name="email"></label>
                <label>Phone<input name="phone"></label>
                <label>Guardian Name<input name="guardianName"></label>
                <label>Guardian Phone<input name="guardianPhone"></label>
                <label>City<input name="city"></label>
                <label>State<input name="state"></label>
                <label>PIN Code<input name="pincode"></label>
                <label>Blood Group
                    <select name="bloodGroup">
                        <option value="">Select</option>
                        <option value="A+">A+</option>
                        <option value="A-">A-</option>
                        <option value="B+">B+</option>
                        <option value="B-">B-</option>
                        <option value="O+">O+</option>
                        <option value="O-">O-</option>
                        <option value="AB+">AB+</option>
                        <option value="AB-">AB-</option>
                    </select>
                </label>
                <label>Status
                    <select name="status">
                        <option value="ACTIVE">ACTIVE</option>
                        <option value="INACTIVE">INACTIVE</option>
                        <option value="GRADUATED">GRADUATED</option>
                        <option value="SUSPENDED">SUSPENDED</option>
                    </select>
                </label>
                <label class="wide">Address<textarea name="address"></textarea></label>
            </div>

            <p style="margin-top: 24px;"><button type="submit" class="button button-primary">Update Student</button></p>
        </form>
    </section>
</main>
<script>
const root = window.location.pathname.includes('/students/') ? window.location.pathname.split('/students/')[0] + '/' : './';
const form = document.getElementById('edit-student-form');
form.action = root + 'students/update';
const id = new URLSearchParams(window.location.search).get('id');
const error = new URLSearchParams(window.location.search).get('error');
if (error) {
    const message = document.getElementById('error-message');
    message.textContent = error;
    message.hidden = false;
}

// First load departments & courses, then load student data
Promise.all([
    fetch(root + 'api/departments').then(r => r.ok ? r.json() : []).catch(() => []),
    fetch(root + 'api/courses').then(r => r.ok ? r.json() : []).catch(() => [])
]).then(([depts, courses]) => {
    if (depts && depts.length > 0) {
        document.getElementById('departmentSelect').innerHTML = 
            depts.map(d => `<option value="${d.departmentId}">${d.departmentId} - ${d.departmentName} (${d.departmentCode})</option>`).join('');
    }
    if (courses && courses.length > 0) {
        document.getElementById('courseSelect').innerHTML = 
            courses.map(c => `<option value="${c.courseId}">${c.courseId} - ${c.courseName} (${c.courseCode})</option>`).join('');
    }

    if (id) {
        return fetch(root + 'api/students/' + encodeURIComponent(id))
            .then(res => {
                if (!res.ok) throw new Error('Student not found.');
                return res.json();
            }).then(student => {
                Object.keys(student).forEach(name => {
                    const field = form.elements[name];
                    if (field) field.value = student[name] ?? '';
                });
            });
    }
}).catch(err => {
    const message = document.getElementById('error-message');
    message.textContent = err.message;
    message.hidden = false;
});
</script>
</body></html>
