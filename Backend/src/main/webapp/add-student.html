<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Add Student - Centurion University ERP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link id="student-form-styles" rel="stylesheet" href="assets/css/student-form.css">
</head>
<body>

    <!-- Main Navigation Bar -->
    <header class="erp-navbar">
        <div class="erp-navbar-inner">
            <a href="dashboard.html" class="erp-brand">
                <span class="erp-brand-icon">&#127891;</span>
                Centurion <span>ERP</span>
            </a>
            <nav>
                <ul class="erp-nav-links">
                    <li><a href="dashboard.html">Dashboard</a></li>
                    <li><a href="student-list.html" class="active">Students</a></li>
                    <li><a href="faculty-list.html">Faculty</a></li>
                    <li><a href="courses.html">Courses &amp; Syllabus</a></li>
                    <li><a href="attendance.html">Attendance</a></li>
                    <li><a href="results.html">Results &amp; Grades</a></li>
                    <li><a href="timetable.html">Timetable</a></li>
                    <li><a href="notices.html">Notices</a></li>
                </ul>
            </nav>
            <div>
                <a class="button button-danger" style="padding: 6px 14px; font-size: 13px;" href="logout">Logout</a>
            </div>
        </div>
    </header>

<main>
    <div class="topbar" style="margin-top: 20px;">
        <div>
            <h1>Add New Student</h1>
            <p class="muted" style="margin: 4px 0 0 0;">Create a new student academic record</p>
        </div>
        <div style="display: flex; gap: 10px;">
            <a id="student-list-link" class="button button-outline" href="student-list.html">Student List</a>
            <a class="button button-outline" href="dashboard.html">Dashboard</a>
        </div>
    </div>

    <section class="panel">
        <p id="error-message" class="alert error" hidden></p>

        <form id="add-student-form" method="post" action="students/add">
            <h3 style="margin-top: 0; border-bottom: 1px solid #e2e8f0; padding-bottom: 8px;">Basic &amp; Academic Info</h3>
            <div class="form-grid">
                <label>Admission Number *<input name="admissionNumber" required maxlength="50" placeholder="e.g. CUTM-2026-001"></label>
                <label>Roll Number<input name="rollNumber" maxlength="50" placeholder="e.g. 260101001"></label>
                <label>First Name *<input name="firstName" required maxlength="100" placeholder="Student first name"></label>
                <label>Last Name<input name="lastName" maxlength="100" placeholder="Student last name"></label>
                <label>Gender
                    <select name="gender">
                        <option value="">Select Gender</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                    </select>
                </label>
                <label>Date of Birth<input type="date" name="dateOfBirth"></label>
                <label>Department *
                    <select name="departmentId" id="departmentSelect" required>
                        <option value="1">1 - Computer Science and Engineering (CSE)</option>
                    </select>
                </label>
                <label>Course *
                    <select name="courseId" id="courseSelect" required>
                        <option value="1">1 - Bachelor of Computer Applications (BCA)</option>
                    </select>
                </label>
                <label>Semester Number *
                    <select name="semesterId" required>
                        <option value="1">Semester 1</option>
                        <option value="2">Semester 2</option>
                        <option value="3">Semester 3</option>
                        <option value="4">Semester 4</option>
                        <option value="5">Semester 5</option>
                        <option value="6">Semester 6</option>
                        <option value="7">Semester 7</option>
                        <option value="8">Semester 8</option>
                    </select>
                </label>
                <label>Admission Date<input type="date" name="admissionDate"></label>
            </div>

            <h3 style="border-bottom: 1px solid #e2e8f0; padding-bottom: 8px; margin-top: 24px;">Contact &amp; Personal Info</h3>
            <div class="form-grid">
                <label>Email Address (Used for Login) *<input type="email" name="email" required maxlength="150" placeholder="student@example.com"></label>
                <label>Initial Login Password *<input type="text" name="password" required value="student123" placeholder="Set student password"></label>
                <label>Phone Number<input name="phone" maxlength="20" placeholder="e.g. 9876543210"></label>
                <label>Guardian Name<input name="guardianName" maxlength="150" placeholder="Parent or guardian"></label>
                <label>Guardian Phone<input name="guardianPhone" maxlength="20" placeholder="Guardian contact"></label>
                <label>City<input name="city" maxlength="100"></label>
                <label>State<input name="state" maxlength="100"></label>
                <label>PIN Code<input name="pincode" maxlength="10"></label>
                <label>Blood Group
                    <select name="bloodGroup">
                        <option value="">Select Blood Group</option>
                        <option value="A+">A+</option>
                        <option value="A-">A-</option>
                        <option value="B+">B+</option>
                        <option value="B-">B-</option>
                        <option value="O+">O+</option>
                        <option value="O-">O-</option>
                        <option value="AB+">AB+</option>
                        <option value="AB-">AB-</option>
                    </select>
                </label>
                <label class="wide">Residential Address<textarea name="address" maxlength="255" placeholder="Full address"></textarea></label>
            </div>

            <p style="margin-top: 24px;">
                <button type="submit" class="button button-primary">Save Student</button>
            </p>
        </form>
    </section>
</main>
<script>
    const applicationRoot = window.location.pathname.includes('/students/')
        ? window.location.pathname.split('/students/')[0] + '/'
        : './';
    document.getElementById('student-form-styles').href = applicationRoot + 'assets/css/student-form.css';
    document.getElementById('student-list-link').href = applicationRoot + 'students/list';
    document.getElementById('add-student-form').action = applicationRoot + 'students/add';

    const error = new URLSearchParams(window.location.search).get('error');
    if (error) {
        const errorMessage = document.getElementById('error-message');
        errorMessage.textContent = error;
        errorMessage.hidden = false;
    }

    // Load active departments dynamically from API
    fetch(applicationRoot + 'api/departments')
        .then(res => res.ok ? res.json() : [])
        .then(depts => {
            if (depts && depts.length > 0) {
                const select = document.getElementById('departmentSelect');
                select.innerHTML = depts.map(d => `<option value="${d.departmentId}">${d.departmentId} - ${d.departmentName} (${d.departmentCode})</option>`).join('');
            }
        }).catch(() => {});

    // Load active courses dynamically from API
    fetch(applicationRoot + 'api/courses')
        .then(res => res.ok ? res.json() : [])
        .then(courses => {
            if (courses && courses.length > 0) {
                const select = document.getElementById('courseSelect');
                select.innerHTML = courses.map(c => `<option value="${c.courseId}">${c.courseId} - ${c.courseName} (${c.courseCode})</option>`).join('');
            }
        }).catch(() => {});
</script>
</body></html>
