            <a href="dashboard.html" class="erp-brand">
                <img src="assets/img/university-logo.jpg" alt="Centurion University Logo" class="erp-brand-img" width="28" height="28" style="width: 28px !important; height: 28px !important; max-width: 28px !important; max-height: 28px !important; border-radius: 50% !important; object-fit: cover !important; flex-shrink: 0 !important; display: inline-block !important;">
                <span class="erp-brand-text">
                    <span class="erp-brand-title">Centurion <strong>ERP</strong></span>
                    <span class="erp-brand-badge">Academic</span>
                </span>
            </a>
            <nav class="erp-nav" id="erpNav">
                <ul class="erp-nav-links">
                    <li><a href="dashboard.html"><span class="nav-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg></span> Dashboard</a></li>
                    <li><a href="student-list.html" class="active"><span class="nav-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></span> Students</a></li>
                    <li><a href="faculty-list.html"><span class="nav-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></span> Faculty</a></li>
                    <li><a href="courses.html"><span class="nav-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg></span> Courses</a></li>
                    <li><a href="attendance.html"><span class="nav-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></span> Attendance</a></li>

            <!-- Mobile hamburger toggle -->
            <button class="erp-nav-toggle" id="navToggle" aria-label="Toggle navigation" onclick="document.getElementById('erpNav').classList.toggle('open')">

            </button>
        </div>
    </header>

<main>
    <div class="topbar" style="margin-top: 20px;">
        <div>
            <h1>Add New Student</h1>
            <p class="muted" style="margin: 4px 0 0 0;">Create a new student academic record</p>
        </div>
        <div style="display: flex; gap: 10px;">
            <a id="student-list-link" class="button button-outline" href="student-list.html">Student List</a>
            <a class="button button-outline" href="dashboard.html">Dashboard</a>
        </div>
    </div>

    <section class="panel">
        <p id="error-message" class="alert error" hidden></p>

        <form id="add-student-form" method="post" action="students/add">
            <h3 style="margin-top: 0; border-bottom: 1px solid #e2e8f0; padding-bottom: 8px;">Basic &amp; Academic Info</h3>
            <div class="form-grid">
                <label>Admission Number *<input name="admissionNumber" required maxlength="50" placeholder="e.g. CUTM-2026-001"></label>
                <label>Roll Number<input name="rollNumber" maxlength="50" placeholder="e.g. 260101001"></label>
                <label>First Name *<input name="firstName" required maxlength="100" placeholder="Student first name"></label>
                <label>Last Name<input name="lastName" maxlength="100" placeholder="Student last name"></label>
                <label>Gender
                    <select name="gender">
                        <option value="">Select Gender</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                    </select>
                </label>
                <label>Date of Birth<input type="date" name="dateOfBirth"></label>
                <label>Department *
                    <select name="departmentId" id="departmentSelect" required>
                        <option value="1">1 - Computer Science and Engineering (CSE)</option>
                    </select>
                </label>
                <label>Course *
                    <select name="courseId" id="courseSelect" required>
                        <option value="1">1 - Bachelor of Computer Applications (BCA)</option>
                    </select>
                </label>
                <label>Semester Number *
                    <select name="semesterId" required>
                        <option value="1">Semester 1</option>
                        <option value="2">Semester 2</option>
                        <option value="3">Semester 3</option>
                        <option value="4">Semester 4</option>
                        <option value="5">Semester 5</option>
                        <option value="6">Semester 6</option>
                        <option value="7">Semester 7</option>
                        <option value="8">Semester 8</option>
                    </select>
                </label>
                <label>Admission Date<input type="date" name="admissionDate" id="admissionDate"></label>
            </div>

            <h3 style="border-bottom: 1px solid #e2e8f0; padding-bottom: 8px; margin-top: 24px;">Contact &amp; Personal Info</h3>
            <div class="form-grid">
                <label>Email Address (Used for Login) *<input type="email" name="email" required maxlength="150" placeholder="student@example.com"></label>
                <label>Initial Login Password *<input type="text" name="password" required value="student123" placeholder="Set student password"></label>
                <label>Phone Number<input name="phone" maxlength="20" placeholder="e.g. 9876543210"></label>
                <label>Guardian Name<input name="guardianName" maxlength="150" placeholder="Parent or guardian"></label>
                <label>Guardian Phone<input name="guardianPhone" maxlength="20" placeholder="Guardian contact"></label>
                <label>City<input name="city" maxlength="100"></label>
                <label>State<input name="state" maxlength="100"></label>
                <label>PIN Code<input name="pincode" maxlength="10"></label>
                <label>Blood Group
                    <select name="bloodGroup">
                        <option value="">Select Blood Group</option>
                        <option value="A+">A+</option>
                        <option value="A-">A-</option>
                        <option value="B+">B+</option>
                        <option value="B-">B-</option>
                        <option value="O+">O+</option>
                        <option value="O-">O-</option>
                        <option value="AB+">AB+</option>
                        <option value="AB-">AB-</option>
                    </select>
                </label>
                <label class="wide">Residential Address<textarea name="address" maxlength="255" placeholder="Full address"></textarea></label>
            </div>

            <p style="margin-top: 24px;">
                <button type="submit" class="button button-primary">Save Student</button>
            </p>
        </form>
    </section>
</main>
<script>
    const applicationRoot = window.location.pathname.includes('/students/')
        ? window.location.pathname.split('/students/')[0] + '/'
        : './';
    document.getElementById('student-form-styles').href = applicationRoot + 'assets/css/student-form.css';
    document.getElementById('student-list-link').href = applicationRoot + 'students/list';
    document.getElementById('add-student-form').action = applicationRoot + 'students/add';

    const error = new URLSearchParams(window.location.search).get('error');
    if (error) {
        const errorMessage = document.getElementById('error-message');
        errorMessage.textContent = error;
        errorMessage.hidden = false;
    }

    // Load active departments dynamically from API
    fetch(applicationRoot + 'api/departments')
        .then(res => res.ok ? res.json() : [])
        .then(depts => {
            if (depts && depts.length > 0) {
                const select = document.getElementById('departmentSelect');
                select.innerHTML = depts.map(d => `<option value="${d.departmentId}">${d.departmentId} - ${d.departmentName} (${d.departmentCode})</option>`).join('');
            }
        }).catch(() => {});

    // Load active courses dynamically from API
    fetch(applicationRoot + 'api/courses')
        .then(res => res.ok ? res.json() : [])
        .then(courses => {
            if (courses && courses.length > 0) {
                const select = document.getElementById('courseSelect');
                select.innerHTML = courses.map(c => `<option value="${c.courseId}">${c.courseId} - ${c.courseName} (${c.courseCode})</option>`).join('');
            }
        }).catch(() => {});

    // Default admission date to Today, but allow past dates for backdated/transfer entries
    const admDate = document.getElementById('admissionDate');
    if (admDate && !admDate.value) {
        const today = new Date().toISOString().split('T')[0];
        admDate.value = today;
        admDate.max = today; // Restrict future dates
    }
</script>
</body></html>
