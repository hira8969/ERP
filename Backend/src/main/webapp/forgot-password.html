<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Forgot Password</title>
    <link rel="stylesheet" href="assets/css/student-form.css">
</head>
<body>
<main>
    <section class="panel">
        <h1>Forgot Password</h1>
        <form onsubmit="event.preventDefault(); document.getElementById('message').hidden = false;">
            <label>Email<input type="email" required></label>
            <p><button type="submit">Request reset</button></p>
        </form>
        <p id="message" class="muted" hidden>Password reset instructions will be sent if the email exists.</p>
        <p><a href="login.html">Back to login</a></p>
    </section>
</main>
</body>
</html>
