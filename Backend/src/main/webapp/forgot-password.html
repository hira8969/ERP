<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Forgot Password - Centurion University ERP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/student-form.css">
</head>
<body>
<main>
    <div class="topbar">
        <a href="login.html" class="link-muted">&larr; Back to Login</a>
        <span class="badge badge-info">Account Recovery</span>
    </div>

    <section class="panel auth-panel">
        <div class="auth-header">
            <div class="portal-badge">ACCOUNT RECOVERY</div>
            <h1>Forgot Password</h1>
            <p class="muted">Enter your registered email to receive password reset instructions</p>
        </div>

        <p id="resetMessage" class="alert success" hidden>
            Password reset instructions have been sent to your email address if an account exists.
        </p>

        <form id="forgotForm" onsubmit="event.preventDefault(); document.getElementById('resetMessage').hidden = false; document.getElementById('submitBtn').disabled = true; document.getElementById('submitBtn').textContent = 'Instructions Sent';">
            <div class="form-grid single-col">
                <label>
                    Registered Email Address
                    <input type="email" id="email" required placeholder="name@domain.com" autocomplete="email">
                </label>
            </div>
            <p style="margin-top: 20px;">
                <button type="submit" id="submitBtn" class="button button-primary button-block">Send Reset Link</button>
            </p>
        </form>

        <div class="auth-links" style="justify-content: center; margin-top: 24px;">
            <p>Remembered your credentials? <a href="login.html">Return to Sign In</a></p>
        </div>
    </section>
</main>
</body>
</html>
